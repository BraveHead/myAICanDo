  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;m6-memory-impact-flow&quot;&gt;
  &lt;style&gt;
    #m6-memory-impact-flow {
      color: var(--foreground);
      font-family: var(--font-sans);
      font-size: var(--font-size-normal);
      line-height: var(--line-height-normal);
    }

    #m6-memory-impact-flow :is(p, h2, h3, ul, ol) {
      margin: 0;
    }

    #m6-memory-impact-flow code {
      overflow-wrap: anywhere;
    }

    #m6-memory-impact-flow .legend,
    #m6-memory-impact-flow .flow-summary,
    #m6-memory-impact-flow .boundary-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      align-items: center;
    }

    #m6-memory-impact-flow .legend {
      padding-block: 0 12px;
      border-bottom: 1px solid var(--border);
      color: var(--muted-foreground);
    }

    #m6-memory-impact-flow .legend-item {
      display: inline-flex;
      gap: 7px;
      align-items: center;
    }

    #m6-memory-impact-flow .swatch {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--lane-color);
    }

    #m6-memory-impact-flow .sequence {
      display: grid;
      gap: 0;
      list-style: none;
      padding: 16px 0 0;
    }

    #m6-memory-impact-flow .step {
      position: relative;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 12px;
      padding-bottom: 18px;
    }

    #m6-memory-impact-flow .step:not(:last-child)::before {
      position: absolute;
      top: 32px;
      bottom: 0;
      left: 16px;
      width: 1px;
      content: &quot;&quot;;
      background: var(--border);
    }

    #m6-memory-impact-flow .step-marker {
      position: relative;
      z-index: 1;
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 50%;
      color: var(--primary-foreground);
      background: var(--lane-color);
      font-weight: 500;
    }

    #m6-memory-impact-flow .step-card,
    #m6-memory-impact-flow .branch-card,
    #m6-memory-impact-flow .impact-card {
      min-width: 0;
      padding: 12px;
      border-inline-start: 3px solid var(--lane-color);
      border-radius: var(--radius-md);
      background: color-mix(in srgb, var(--lane-color) 8%, var(--card));
    }

    #m6-memory-impact-flow .step-card {
      display: grid;
      gap: 7px;
    }

    #m6-memory-impact-flow .step-head,
    #m6-memory-impact-flow .card-head {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 10px;
      align-items: baseline;
      justify-content: space-between;
    }

    #m6-memory-impact-flow h2,
    #m6-memory-impact-flow h3 {
      color: var(--foreground);
      font-weight: 500;
    }

    #m6-memory-impact-flow h2 {
      font-size: var(--font-size-h2);
    }

    #m6-memory-impact-flow h3 {
      font-size: var(--font-size-h3);
    }

    #m6-memory-impact-flow .phase {
      color: var(--lane-color);
      font-size: var(--font-size-small);
      font-weight: 500;
    }

    #m6-memory-impact-flow .detail,
    #m6-memory-impact-flow .impact-card p,
    #m6-memory-impact-flow .branch-card p {
      color: var(--muted-foreground);
    }

    #m6-memory-impact-flow .detail {
      overflow-wrap: anywhere;
    }

    #m6-memory-impact-flow .flow-summary {
      padding: 10px 0 2px;
      color: var(--muted-foreground);
    }

    #m6-memory-impact-flow .flow-summary strong,
    #m6-memory-impact-flow .boundary-strip strong {
      color: var(--foreground);
      font-weight: 500;
    }

    #m6-memory-impact-flow .parallel {
      display: grid;
      gap: 10px;
      padding: 0 0 18px 46px;
    }

    #m6-memory-impact-flow .parallel-label {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      color: var(--muted-foreground);
      font-size: var(--font-size-small);
    }

    #m6-memory-impact-flow .parallel-label::before {
      width: 28px;
      height: 1px;
      content: &quot;&quot;;
      background: var(--border);
    }

    #m6-memory-impact-flow .branch-grid,
    #m6-memory-impact-flow .impact-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    #m6-memory-impact-flow .branch-card,
    #m6-memory-impact-flow .impact-card {
      display: grid;
      gap: 7px;
    }

    #m6-memory-impact-flow .branch-card ul,
    #m6-memory-impact-flow .impact-card ul {
      display: grid;
      gap: 4px;
      padding-left: 16px;
      color: var(--muted-foreground);
    }

    #m6-memory-impact-flow .branch-card li::marker,
    #m6-memory-impact-flow .impact-card li::marker {
      color: var(--lane-color);
    }

    #m6-memory-impact-flow .boundary-strip {
      margin-top: 0;
      padding: 12px;
      border-block: 1px solid var(--border);
      color: var(--muted-foreground);
    }

    #m6-memory-impact-flow .boundary-item {
      min-width: min(100%, 190px);
      flex: 1 1 190px;
    }

    #m6-memory-impact-flow .boundary-item strong,
    #m6-memory-impact-flow .boundary-item span {
      display: block;
    }

    #m6-memory-impact-flow .impact-zone {
      display: grid;
      gap: 10px;
      padding-top: 16px;
    }

    #m6-memory-impact-flow .impact-title {
      color: var(--muted-foreground);
      font-size: var(--font-size-small);
      font-weight: 500;
    }

    #m6-memory-impact-flow .lane-source {
      --lane-color: var(--viz-series-1);
    }

    #m6-memory-impact-flow .lane-storage {
      --lane-color: var(--viz-series-2);
    }

    #m6-memory-impact-flow .lane-runtime {
      --lane-color: var(--viz-series-3);
    }

    #m6-memory-impact-flow .lane-downstream {
      --lane-color: var(--viz-series-4);
    }

    #m6-memory-impact-flow .lane-security {
      --lane-color: var(--viz-series-5);
    }

    #m6-memory-impact-flow .lane-stable {
      --lane-color: var(--viz-series-6);
    }

    @media (max-width: 620px) {
      #m6-memory-impact-flow .branch-grid,
      #m6-memory-impact-flow .impact-grid {
        grid-template-columns: 1fr;
      }

      #m6-memory-impact-flow .parallel {
        padding-left: 0;
      }
    }
  &lt;/style&gt;

  &lt;div class=&quot;legend&quot; aria-label=&quot;Data flow color legend&quot;&gt;
    &lt;span class=&quot;legend-item lane-source&quot; style=&quot;--lane-color: var(--viz-series-1)&quot;&gt;&lt;span class=&quot;swatch&quot;&gt;&lt;/span&gt;上游输入 / 用户记忆&lt;/span&gt;
    &lt;span class=&quot;legend-item lane-storage&quot; style=&quot;--lane-color: var(--viz-series-2)&quot;&gt;&lt;span class=&quot;swatch&quot;&gt;&lt;/span&gt;持久化 / 迁移&lt;/span&gt;
    &lt;span class=&quot;legend-item lane-runtime&quot; style=&quot;--lane-color: var(--viz-series-3)&quot;&gt;&lt;span class=&quot;swatch&quot;&gt;&lt;/span&gt;Harness 运行态&lt;/span&gt;
    &lt;span class=&quot;legend-item lane-downstream&quot; style=&quot;--lane-color: var(--viz-series-4)&quot;&gt;&lt;span class=&quot;swatch&quot;&gt;&lt;/span&gt;下游输出 / UI&lt;/span&gt;
    &lt;span class=&quot;legend-item lane-security&quot; style=&quot;--lane-color: var(--viz-series-5)&quot;&gt;&lt;span class=&quot;swatch&quot;&gt;&lt;/span&gt;隔离 / 安全边界&lt;/span&gt;
    &lt;span class=&quot;legend-item lane-stable&quot; style=&quot;--lane-color: var(--viz-series-6)&quot;&gt;&lt;span class=&quot;swatch&quot;&gt;&lt;/span&gt;保持不变&lt;/span&gt;
  &lt;/div&gt;

  &lt;div class=&quot;flow-summary&quot;&gt;
    &lt;strong&gt;执行主链：&lt;/strong&gt;
    &lt;span&gt;页面上下文 → 服务端鉴权 → workspace/thread scope → 三路 memory 读取 → MemoryManifest → AgentHarness → Prompt / checkpoint → 下游响应与持久化&lt;/span&gt;
  &lt;/div&gt;

  &lt;ol class=&quot;sequence&quot; aria-label=&quot;M6 workspace memory data flow execution order&quot;&gt;
    &lt;li class=&quot;step lane-source&quot;&gt;
      &lt;span class=&quot;step-marker&quot;&gt;1&lt;/span&gt;
      &lt;div class=&quot;step-card&quot;&gt;
        &lt;div class=&quot;step-head&quot;&gt;
          &lt;h2&gt;页面与请求上下文&lt;/h2&gt;
          &lt;span class=&quot;phase&quot;&gt;上游输入&lt;/span&gt;
        &lt;/div&gt;
        &lt;p class=&quot;detail&quot;&gt;&lt;code&gt;AppShell&lt;/code&gt;、workspace selector、&lt;code&gt;ChatRuntimeProvider&lt;/code&gt; 产生 &lt;code&gt;tenantId&lt;/code&gt;、&lt;code&gt;workspaceId&lt;/code&gt;、&lt;code&gt;threadId&lt;/code&gt;；新请求使用 &lt;code&gt;/:tenantId/workspace/:workspaceId/chat/:threadId&lt;/code&gt;。&lt;/p&gt;
        &lt;p class=&quot;detail&quot;&gt;数据影响：workspace 切换会改变 thread 列表、新建对话范围和后续 memory 读取边界；用户记忆的 tenant/user scope 不变。&lt;/p&gt;
      &lt;/div&gt;
    &lt;/li&gt;

    &lt;li class=&quot;step lane-security&quot;&gt;
      &lt;span class=&quot;step-marker&quot;&gt;2&lt;/span&gt;
      &lt;div class=&quot;step-card&quot;&gt;
        &lt;div class=&quot;step-head&quot;&gt;
          &lt;h2&gt;租户与 workspace 鉴权&lt;/h2&gt;
          &lt;span class=&quot;phase&quot;&gt;安全边界&lt;/span&gt;
        &lt;/div&gt;
        &lt;p class=&quot;detail&quot;&gt;&lt;code&gt;requireTenantAccess&lt;/code&gt; → &lt;code&gt;requireWorkspaceAccess&lt;/code&gt;；chat、thread、approval 都重新校验 workspace 是否属于当前 tenant。&lt;/p&gt;
        &lt;p class=&quot;detail&quot;&gt;数据流向：客户端提交的 &lt;code&gt;workspaceId&lt;/code&gt; 只作为候选值，服务端以 tenant access 和已存 thread 归属为准，阻断跨 tenant / 跨 workspace 访问。&lt;/p&gt;
      &lt;/div&gt;
    &lt;/li&gt;

    &lt;li class=&quot;step lane-storage&quot;&gt;
      &lt;span class=&quot;step-marker&quot;&gt;3&lt;/span&gt;
      &lt;div class=&quot;step-card&quot;&gt;
        &lt;div class=&quot;step-head&quot;&gt;
          &lt;h2&gt;默认 workspace 与历史兼容&lt;/h2&gt;
          &lt;span class=&quot;phase&quot;&gt;迁移 / 回填&lt;/span&gt;
        &lt;/div&gt;
        &lt;p class=&quot;detail&quot;&gt;&lt;code&gt;assistant_workspaces&lt;/code&gt; 按 tenant 幂等创建默认工作区；历史 &lt;code&gt;assistant_threads.workspace_id&lt;/code&gt;、&lt;code&gt;assistant_thread_todo_states.workspace_id&lt;/code&gt; 为 &lt;code&gt;NULL&lt;/code&gt; 时只回填到默认 workspace。&lt;/p&gt;
        &lt;p class=&quot;detail&quot;&gt;旧 URL 先查询 thread 的实际 workspace；历史未绑定数据使用默认 workspace，再重定向到规范 workspace URL。thread 创建后不再跨 workspace 移动。&lt;/p&gt;
      &lt;/div&gt;
    &lt;/li&gt;

    &lt;li class=&quot;step lane-security&quot;&gt;
      &lt;span class=&quot;step-marker&quot;&gt;4&lt;/span&gt;
      &lt;div class=&quot;step-card&quot;&gt;
        &lt;div class=&quot;step-head&quot;&gt;
          &lt;h2&gt;固定 scope 并分发数据边界&lt;/h2&gt;
          &lt;span class=&quot;phase&quot;&gt;隔离键&lt;/span&gt;
        &lt;/div&gt;
        &lt;p class=&quot;detail&quot;&gt;&lt;code&gt;ThreadScope = tenantHashId + userHashId + workspaceId&lt;/code&gt;；&lt;code&gt;MemoryScope = tenantHashId + userHashId&lt;/code&gt;。&lt;/p&gt;
        &lt;p class=&quot;detail&quot;&gt;同一 workspace 的不同 thread 共享 project memory；不同 workspace 使用不同 &lt;code&gt;AGENTS.md&lt;/code&gt;；用户 memory 不随 workspace 切换丢失。&lt;/p&gt;
      &lt;/div&gt;
    &lt;/li&gt;
  &lt;/ol&gt;

  &lt;section class=&quot;parallel&quot; aria-label=&quot;Parallel memory loading branches&quot;&gt;
    &lt;span class=&quot;parallel-label&quot;&gt;第 5 步：三类数据并行读取，完成后汇聚&lt;/span&gt;
    &lt;div class=&quot;branch-grid&quot;&gt;
      &lt;article class=&quot;branch-card lane-source&quot;&gt;
        &lt;div class=&quot;card-head&quot;&gt;
          &lt;h3&gt;5A · 用户记忆&lt;/h3&gt;
          &lt;span class=&quot;phase&quot;&gt;上游&lt;/span&gt;
        &lt;/div&gt;
        &lt;p&gt;&lt;code&gt;memory-store&lt;/code&gt;&lt;/p&gt;
        &lt;ul&gt;
          &lt;li&gt;范围：tenant + user&lt;/li&gt;
          &lt;li&gt;读取 active memories&lt;/li&gt;
          &lt;li&gt;workspace 切换不改变数据&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/article&gt;

      &lt;article class=&quot;branch-card lane-source&quot;&gt;
        &lt;div class=&quot;card-head&quot;&gt;
          &lt;h3&gt;5B · 项目记忆&lt;/h3&gt;
          &lt;span class=&quot;phase&quot;&gt;上游&lt;/span&gt;
        &lt;/div&gt;
        &lt;p&gt;workspace 根目录 &lt;code&gt;AGENTS.md&lt;/code&gt;&lt;/p&gt;
        &lt;ul&gt;
          &lt;li&gt;路径：tenant / workspaces / workspace&lt;/li&gt;
          &lt;li&gt;只读、UTF-8、≤ 64 KiB&lt;/li&gt;
          &lt;li&gt;拒绝 symlink、越权路径和仓库根 AGENTS.md&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/article&gt;

      &lt;article class=&quot;branch-card lane-runtime&quot;&gt;
        &lt;div class=&quot;card-head&quot;&gt;
          &lt;h3&gt;5C · Harness memory&lt;/h3&gt;
          &lt;span class=&quot;phase&quot;&gt;运行态&lt;/span&gt;
        &lt;/div&gt;
        &lt;p&gt;当前 thread 的临时状态&lt;/p&gt;
        &lt;ul&gt;
          &lt;li&gt;todo state：tenant + user + workspace + thread&lt;/li&gt;
          &lt;li&gt;offload：thread sandbox 的 &lt;code&gt;.context/offloads/*.json&lt;/code&gt;&lt;/li&gt;
          &lt;li&gt;不写入长期 user/project memory&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/article&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;ol class=&quot;sequence&quot; start=&quot;6&quot; aria-label=&quot;M6 memory manifest and agent execution order&quot;&gt;
    &lt;li class=&quot;step lane-runtime&quot;&gt;
      &lt;span class=&quot;step-marker&quot;&gt;6&lt;/span&gt;
      &lt;div class=&quot;step-card&quot;&gt;
        &lt;div class=&quot;step-head&quot;&gt;
          &lt;h2&gt;组装 MemoryManifest&lt;/h2&gt;
          &lt;span class=&quot;phase&quot;&gt;数据汇聚&lt;/span&gt;
        &lt;/div&gt;
        &lt;p class=&quot;detail&quot;&gt;&lt;code&gt;{ schemaVersion: 1, user: [], project: [], harness: {} }&lt;/code&gt; 统一承载三类上下文；日志和 SSE 只记录数量、来源与 &lt;code&gt;workspaceId&lt;/code&gt;，不输出完整 memory 内容。&lt;/p&gt;
        &lt;p class=&quot;detail&quot;&gt;Manifest 是只读上下文数据，不能覆盖 system prompt、agent policy、工具权限或 approval 规则。&lt;/p&gt;
      &lt;/div&gt;
    &lt;/li&gt;

    &lt;li class=&quot;step lane-runtime&quot;&gt;
      &lt;span class=&quot;step-marker&quot;&gt;7&lt;/span&gt;
      &lt;div class=&quot;step-card&quot;&gt;
        &lt;div class=&quot;step-head&quot;&gt;
          &lt;h2&gt;进入 AgentHarness&lt;/h2&gt;
          &lt;span class=&quot;phase&quot;&gt;运行时传播&lt;/span&gt;
        &lt;/div&gt;
        &lt;p class=&quot;detail&quot;&gt;同一份 manifest 传给 coordinator、普通 agent、subagent 和 fallback model；subagent 继承 workspace scope，但使用独立 child thread ID。&lt;/p&gt;
        &lt;p class=&quot;detail&quot;&gt;工具结果产生的新 offload artifact 在后续 turn 重新扫描并进入当前 thread 的 harness memory 引用集合。&lt;/p&gt;
      &lt;/div&gt;
    &lt;/li&gt;

    &lt;li class=&quot;step lane-runtime&quot;&gt;
      &lt;span class=&quot;step-marker&quot;&gt;8&lt;/span&gt;
      &lt;div class=&quot;step-card&quot;&gt;
        &lt;div class=&quot;step-head&quot;&gt;
          &lt;h2&gt;生成 Prompt 与 checkpoint namespace&lt;/h2&gt;
          &lt;span class=&quot;phase&quot;&gt;下游运行输入&lt;/span&gt;
        &lt;/div&gt;
        &lt;p class=&quot;detail&quot;&gt;Prompt 固定输出 &lt;code&gt;## memory&lt;/code&gt;、&lt;code&gt;### user memory&lt;/code&gt;、&lt;code&gt;### project memory&lt;/code&gt;、&lt;code&gt;### harness memory&lt;/code&gt; 三段。&lt;/p&gt;
        &lt;p class=&quot;detail&quot;&gt;新 checkpoint key：&lt;code&gt;agentId:tenantHashId:userHashId:workspaceId:threadId&lt;/code&gt;；读取时先查新 key，再兼容旧的 &lt;code&gt;agentId:tenant:user:thread&lt;/code&gt;。&lt;/p&gt;
      &lt;/div&gt;
    &lt;/li&gt;
  &lt;/ol&gt;

  &lt;section class=&quot;impact-zone&quot; aria-label=&quot;Downstream impact data flow&quot;&gt;
    &lt;span class=&quot;impact-title&quot;&gt;第 9 步：下游影响与回流&lt;/span&gt;
    &lt;div class=&quot;impact-grid&quot;&gt;
      &lt;article class=&quot;impact-card lane-downstream&quot;&gt;
        &lt;div class=&quot;card-head&quot;&gt;
          &lt;h3&gt;页面与交互&lt;/h3&gt;
          &lt;span class=&quot;phase&quot;&gt;下游输出&lt;/span&gt;
        &lt;/div&gt;
        &lt;ul&gt;
          &lt;li&gt;workspace selector 切换列表范围&lt;/li&gt;
          &lt;li&gt;左侧只展示当前 workspace threads&lt;/li&gt;
          &lt;li&gt;旧 URL 重定向到规范 URL&lt;/li&gt;
          &lt;li&gt;chat / approval 携带 workspace context&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/article&gt;

      &lt;article class=&quot;impact-card lane-storage&quot;&gt;
        &lt;div class=&quot;card-head&quot;&gt;
          &lt;h3&gt;数据库与文件&lt;/h3&gt;
          &lt;span class=&quot;phase&quot;&gt;持久化回流&lt;/span&gt;
        &lt;/div&gt;
        &lt;ul&gt;
          &lt;li&gt;&lt;code&gt;assistant_workspaces&lt;/code&gt; 保存 workspace 元数据&lt;/li&gt;
          &lt;li&gt;thread / todo 保存 workspace 固定绑定&lt;/li&gt;
          &lt;li&gt;project memory 写入 workspace &lt;code&gt;AGENTS.md&lt;/code&gt;&lt;/li&gt;
          &lt;li&gt;thread sandbox 路径保持不变&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/article&gt;

      &lt;article class=&quot;impact-card lane-security&quot;&gt;
        &lt;div class=&quot;card-head&quot;&gt;
          &lt;h3&gt;Approval 与观测&lt;/h3&gt;
          &lt;span class=&quot;phase&quot;&gt;安全回流&lt;/span&gt;
        &lt;/div&gt;
        &lt;ul&gt;
          &lt;li&gt;approval 执行前重新校验 thread/workspace&lt;/li&gt;
          &lt;li&gt;跨 workspace approval 返回拒绝&lt;/li&gt;
          &lt;li&gt;SSE 只输出事件和非敏感元数据&lt;/li&gt;
          &lt;li&gt;LangSmith trace 增加 workspace 维度&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/article&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;boundary-strip&quot; aria-label=&quot;Data boundary summary&quot;&gt;
    &lt;span class=&quot;boundary-item lane-source&quot;&gt;&lt;strong&gt;用户 memory&lt;/strong&gt;&lt;span&gt;tenant + user；跨 workspace 保持共享&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;boundary-item lane-source&quot;&gt;&lt;strong&gt;项目 memory&lt;/strong&gt;&lt;span&gt;tenant + workspace；只读 AGENTS.md&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;boundary-item lane-runtime&quot;&gt;&lt;strong&gt;Harness memory&lt;/strong&gt;&lt;span&gt;thread 临时态；todo + offload refs&lt;/span&gt;&lt;/span&gt;
    &lt;span class=&quot;boundary-item lane-stable&quot;&gt;&lt;strong&gt;保持不变&lt;/strong&gt;&lt;span&gt;thread sandbox、memory approval、M3 offload 机制&lt;/span&gt;&lt;/span&gt;
  &lt;/div&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
